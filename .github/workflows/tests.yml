name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # Note the glob: `node --test tests/` (directory form) fails on Node 24.
      - run: node --test tests/*.test.js

  manifest:
    name: manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: plugin.json is valid JSON with the required fields
        run: |
          jq -e '.id and .name and .version and .component and .type' plugin.json > /dev/null

      # The DMS registry crawls version/author straight out of plugin.json, so a
      # bumped manifest with no changelog entry ships a version nobody can read
      # about -- and an unbumped manifest ships changes the registry never shows.
      #
      # Reads CHANGELOG.md. The changelog lived in README.md until the docs
      # were split out to the wiki; this check moved with it.
      - name: version has a changelog entry
        run: |
          v=$(jq -r .version plugin.json)
          echo "plugin.json version: $v"
          grep -qF "### $v" CHANGELOG.md || {
            echo "::error file=CHANGELOG.md::No '### $v' section in CHANGELOG.md"
            exit 1
          }

      # The shared JS modules are require()d by the Node tests, so a stray
      # .pragma library line breaks the suite without breaking the widget.
      # GLOB, not a filename list: this check silently stopped covering
      # Backends.js the day that file was added.
      - name: no .pragma library in the shared JS modules
        run: |
          if grep -n '^\s*\.pragma' ./*.js; then
            echo "::error::.pragma library breaks require() in the test suite"
            exit 1
          fi

  # QML syntax check, via qmlformat rather than qmllint.
  #
  # WHY NOT qmllint: it is a type checker, and the DMS shell it would need to
  # resolve types against cannot be installed in CI. Two attempts failed here.
  # Ubuntu's qt6-declarative-dev-tools ships the binary without the QML module
  # tree, so qmllint cannot even load its own builtins ("Failed to find the
  # following builtins: jsroot.qmltypes"), and every finding after that is a
  # cascade from that one missing dependency rather than anything about the
  # code. Disabling the noisy categories did not help either: those flags vary
  # by Qt release and the older binary did not honour them.
  #
  # qmlformat parses without resolving anything, so it works with no module
  # tree at all. It proves exactly one thing -- the file is syntactically
  # valid QML -- which is also the only thing qmllint could ever have proven
  # in this environment, and is worth having: a syntax error currently ships
  # silently and breaks the widget at load.
  #
  # Verified locally in both directions: clean on every .qml file, exit 1 on a
  # malformed property and on a stray closing brace.
  #
  # For the richer semantic checks, run qmllint LOCALLY, where a full Qt and
  # the DMS shell are present:
  #     qmllint DankRssWidget.qml
  qml-syntax:
    name: qml-syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install qmlformat
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-declarative-dev-tools

      - name: locate qmlformat
        id: find
        run: |
          bin=$(command -v qmlformat || true)
          [ -n "$bin" ] || bin=$(ls /usr/lib/qt6/bin/qmlformat 2>/dev/null || true)
          [ -n "$bin" ] || bin=$(find /usr -name 'qmlformat*' -type f -perm -u+x 2>/dev/null | head -1)
          if [ -z "$bin" ]; then
            echo "::error::qmlformat not found after installing qt6-declarative-dev-tools"
            exit 1
          fi
          echo "bin=$bin" >> "$GITHUB_OUTPUT"
          "$bin" --version

      # Self-test first. A syntax checker that cannot fail is worse than none,
      # and a broken tool would otherwise pass every file silently.
      - name: prove the checker can fail
        run: |
          printf 'import QtQuick\nItem { property int x: }\n' > /tmp/broken.qml
          if '${{ steps.find.outputs.bin }}' /tmp/broken.qml > /dev/null 2>&1; then
            echo "::error::qmlformat accepted a deliberately malformed file -- this check proves nothing"
            exit 1
          fi
          echo "checker rejects malformed QML as expected"

      - name: check QML syntax
        run: |
          status=0
          for f in *.qml tests/qml/*.qml; do
            [ -e "$f" ] || continue
            if ! '${{ steps.find.outputs.bin }}' "$f" > /dev/null 2>/tmp/err.txt; then
              echo "::error file=$f::QML syntax error"
              cat /tmp/err.txt
              status=1
            fi
          done
          if [ "$status" = "0" ]; then echo "all .qml files are syntactically valid"; fi
          exit $status
