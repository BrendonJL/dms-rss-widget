name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # Note the glob: `node --test tests/` (directory form) fails on Node 24.
      - run: node --test tests/*.test.js

  manifest:
    name: manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: plugin.json is valid JSON with the required fields
        run: |
          jq -e '.id and .name and .version and .component and .type' plugin.json > /dev/null

      # The DMS registry crawls version/author straight out of plugin.json, so a
      # bumped manifest with no changelog entry ships a version nobody can read
      # about -- and an unbumped manifest ships changes the registry never shows.
      - name: version has a changelog entry
        run: |
          v=$(jq -r .version plugin.json)
          echo "plugin.json version: $v"
          grep -qF "### $v" README.md || {
            echo "::error file=README.md::No '### $v' section in the README changelog"
            exit 1
          }

      # The shared JS modules are require()d by the Node tests, so a stray
      # .pragma library line breaks the suite without breaking the widget.
      # GLOB, not a filename list: this check silently stopped covering
      # Backends.js the day that file was added.
      - name: no .pragma library in the shared JS modules
        run: |
          if grep -n '^\s*\.pragma' ./*.js; then
            echo "::error::.pragma library breaks require() in the test suite"
            exit 1
          fi

  # QML syntax check.
  #
  # SCOPE, honestly: this validates SYNTAX and little else. The DMS shell is
  # not installable in CI, so qs.Common / qs.Widgets / Quickshell and every
  # type reached through them (Theme, StyledText, DankActionButton, and by
  # cascade even Rectangle's properties) are genuinely unresolvable. The
  # resulting import / unqualified / missing-type / missing-property warnings
  # are noise about a missing dependency, not findings about the code, and on
  # older qmllint releases they are fatal -- which is why the first version of
  # this job failed while passing locally on Qt 6.11.
  #
  # So those categories are disabled explicitly and the check is kept to what
  # it can actually prove. That is still worth having: a QML syntax error
  # currently ships silently and breaks the widget at load, with no other
  # tripwire anywhere in this repo. Verified both ways -- clean on all current
  # .qml files, and exit 255 on a deliberately malformed one.
  qmllint:
    name: qmllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install qmllint
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-declarative-dev-tools

      - name: locate qmllint
        id: find
        run: |
          bin=$(command -v qmllint || true)
          [ -n "$bin" ] || bin=$(ls /usr/lib/qt6/bin/qmllint 2>/dev/null || true)
          [ -n "$bin" ] || bin=$(find /usr -name 'qmllint*' -type f -perm -u+x 2>/dev/null | head -1)
          if [ -z "$bin" ]; then
            echo "::error::qmllint not found after installing qt6-declarative-dev-tools"
            exit 1
          fi
          echo "bin=$bin" >> "$GITHUB_OUTPUT"
          "$bin" --version

      # Category flags have come and gone across Qt releases, and an unknown
      # option is itself a fatal error -- so ask this binary what it supports
      # rather than assuming, and pass only those.
      - name: build the supported flag set
        id: flags
        run: |
          bin='${{ steps.find.outputs.bin }}'
          help=$("$bin" --help 2>&1 || true)
          flags=""
          for c in import unqualified missing-type missing-property \
                   unresolved-type unresolved-alias missing-enum-entry; do
            if printf '%s' "$help" | grep -q -- "--$c "; then
              flags="$flags --$c disable"
            else
              echo "note: this qmllint has no --$c, skipping"
            fi
          done
          echo "flags=$flags" >> "$GITHUB_OUTPUT"
          echo "using:$flags"

      - name: lint QML
        run: |
          bin='${{ steps.find.outputs.bin }}'
          status=0
          for f in *.qml tests/qml/*.qml; do
            [ -e "$f" ] || continue
            if ! "$bin" ${{ steps.flags.outputs.flags }} "$f" > /tmp/out.txt 2>&1; then
              echo "::error file=$f::qmllint failed"
              cat /tmp/out.txt
              status=1
            fi
          done
          if [ "$status" = "0" ]; then echo "all .qml files parse cleanly"; fi
          exit $status
