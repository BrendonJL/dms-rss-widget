name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # Note the glob: `node --test tests/` (directory form) fails on Node 24.
      - run: node --test tests/*.test.js

  manifest:
    name: manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: plugin.json is valid JSON with the required fields
        run: |
          jq -e '.id and .name and .version and .component and .type' plugin.json > /dev/null

      # The DMS registry crawls version/author straight out of plugin.json, so a
      # bumped manifest with no changelog entry ships a version nobody can read
      # about -- and an unbumped manifest ships changes the registry never shows.
      #
      # Reads CHANGELOG.md. The changelog lived in README.md until the docs
      # were split out to the wiki; this check moved with it.
      - name: version has a changelog entry
        run: |
          v=$(jq -r .version plugin.json)
          echo "plugin.json version: $v"
          grep -qF "### $v" CHANGELOG.md || {
            echo "::error file=CHANGELOG.md::No '### $v' section in CHANGELOG.md"
            exit 1
          }

      # The shared JS modules are require()d by the Node tests, so a stray
      # .pragma library line breaks the suite without breaking the widget.
      # GLOB, not a filename list: this check silently stopped covering
      # Backends.js the day that file was added.
      - name: no .pragma library in the shared JS modules
        run: |
          if grep -n '^\s*\.pragma' ./*.js; then
            echo "::error::.pragma library breaks require() in the test suite"
            exit 1
          fi

  # QML syntax check, via qmlformat rather than qmllint.
  #
  # WHY NOT qmllint: it is a type checker, and the DMS shell it would need to
  # resolve types against cannot be installed in CI. Two attempts failed here.
  # Ubuntu's qt6-declarative-dev-tools ships the binary without the QML module
  # tree, so qmllint cannot even load its own builtins ("Failed to find the
  # following builtins: jsroot.qmltypes"), and every finding after that is a
  # cascade from that one missing dependency rather than anything about the
  # code. Disabling the noisy categories did not help either: those flags vary
  # by Qt release and the older binary did not honour them.
  #
  # qmlformat parses without resolving anything, so it works with no module
  # tree at all. It proves exactly one thing -- the file is syntactically
  # valid QML -- which is also the only thing qmllint could ever have proven
  # in this environment, and is worth having: a syntax error currently ships
  # silently and breaks the widget at load.
  #
  # Verified locally in both directions: clean on every .qml file, exit 1 on a
  # malformed property and on a stray closing brace.
  #
  # For the richer semantic checks, run qmllint LOCALLY, where a full Qt and
  # the DMS shell are present:
  #     qmllint DankRssWidget.qml
  qml-syntax:
    name: qml-syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install qmlformat
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-declarative-dev-tools

      - name: locate qmlformat
        id: find
        run: |
          bin=$(command -v qmlformat || true)
          [ -n "$bin" ] || bin=$(ls /usr/lib/qt6/bin/qmlformat 2>/dev/null || true)
          [ -n "$bin" ] || bin=$(find /usr -name 'qmlformat*' -type f -perm -u+x 2>/dev/null | head -1)
          if [ -z "$bin" ]; then
            echo "::error::qmlformat not found after installing qt6-declarative-dev-tools"
            exit 1
          fi
          echo "bin=$bin" >> "$GITHUB_OUTPUT"
          "$bin" --version

      # Self-test first. A syntax checker that cannot fail is worse than none,
      # and a broken tool would otherwise pass every file silently.
      - name: prove the checker can fail
        run: |
          printf 'import QtQuick\nItem { property int x: }\n' > /tmp/broken.qml
          if '${{ steps.find.outputs.bin }}' /tmp/broken.qml > /dev/null 2>&1; then
            echo "::error::qmlformat accepted a deliberately malformed file -- this check proves nothing"
            exit 1
          fi
          echo "checker rejects malformed QML as expected"

      - name: check QML syntax
        run: |
          status=0
          for f in *.qml tests/qml/*.qml; do
            [ -e "$f" ] || continue
            if ! '${{ steps.find.outputs.bin }}' "$f" > /dev/null 2>/tmp/err.txt; then
              echo "::error file=$f::QML syntax error"
              cat /tmp/err.txt
              status=1
            fi
          done
          if [ "$status" = "0" ]; then echo "all .qml files are syntactically valid"; fi
          exit $status

  # ─── Semantic QML checking: the gap that took the widget down ───
  #
  # qmlformat above is a SYNTAX check. It parses, and has no opinion about
  # whether a property exists on the type it is assigned to. On 2026-09-13 a
  # change assigning lineHeightMode to a TextEdit (a Text-only property)
  # passed CI and then failed at load: one bad property makes the type
  # unavailable, which made ReaderWindow unavailable, which stopped the whole
  # widget from loading. Nothing in CI said a word.
  #
  # qmllint catches exactly that. It CANNOT resolve the qs.* namespace --
  # Quickshell synthesises those types and ships no qmldir, so that will never
  # work on a runner -- but it resolves plain QtQuick types fine, which is
  # where that bug lived and where most of this kind live.
  #
  # So: run it, and fail only on the message classes that indicate a real type
  # error. Everything else (unresolved qs.* imports, "unknown grouped property
  # scope font" on StyledText) is unavoidable noise from types it cannot see,
  # and treating it as failure would make this job permanently red.
  qml-types:
    name: qml-types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install qmllint
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-declarative-dev-tools

      - name: locate qmllint
        id: find
        run: |
          bin=$(command -v qmllint || true)
          [ -n "$bin" ] || bin=$(ls /usr/lib/qt6/bin/qmllint 2>/dev/null || true)
          [ -n "$bin" ] || bin=$(find /usr -name 'qmllint*' -type f -perm -u+x 2>/dev/null | head -1)
          if [ -z "$bin" ]; then
            echo "::error::qmllint not found after installing qt6-declarative-dev-tools"
            exit 1
          fi
          echo "bin=$bin" >> "$GITHUB_OUTPUT"
          "$bin" --version

          # The QML import path is NOT optional, and getting this wrong is not
          # a subtle failure. Without it qmllint cannot resolve QtQuick, so
          # even Qt.rgba reads as a missing property -- 120 false positives
          # across this repo, every one of them noise. Fail loudly here rather
          # than produce a red job nobody can interpret.
          qmldir=$(qtpaths6 --query QT_INSTALL_QML 2>/dev/null || qtpaths --query QT_INSTALL_QML 2>/dev/null || true)
          [ -d "$qmldir" ] || qmldir=$(ls -d /usr/lib/*/qt6/qml 2>/dev/null | head -1)
          [ -d "$qmldir" ] || qmldir=$(ls -d /usr/lib/qt6/qml 2>/dev/null | head -1)
          if [ ! -d "$qmldir" ]; then
            echo "::error::could not locate the Qt QML import path; qmllint would report nothing but noise"
            exit 1
          fi
          echo "qmldir=$qmldir" >> "$GITHUB_OUTPUT"
          echo "QML import path: $qmldir"

      # Same discipline as qml-syntax: prove the checker can fail before
      # trusting it. That matters more here, because the filter below is a
      # regex over free-text warnings -- a Qt release rewording a message
      # would otherwise silently disarm the entire job.
      - name: prove the checker can fail
        run: |
          printf 'import QtQuick\nTextEdit { lineHeightMode: Text.ProportionalHeight }\n' > /tmp/badprop.qml
          if ! "${{ steps.find.outputs.bin }}" -I "${{ steps.find.outputs.qmldir }}" /tmp/badprop.qml 2>&1 | grep -qiE "missing-property|Could not find property"; then
            echo "::error::qmllint did not flag a known-bad property -- the filter below proves nothing"
            exit 1
          fi
          echo "checker flags a missing property as expected"

      - name: check QML types
        run: |
          status=0
          for f in *.qml tests/qml/*.qml; do
            [ -e "$f" ] || continue
            out=$("${{ steps.find.outputs.bin }}" -I "${{ steps.find.outputs.qmldir }}" -I . "$f" 2>&1 | grep -iE "missing-property|Could not find property|Cannot assign|Type .* unavailable" || true)
            if [ -n "$out" ]; then
              echo "::error file=$f::QML type error"
              echo "$out"
              status=1
            fi
          done
          if [ "$status" = "0" ]; then echo "no QML type errors"; fi
          exit $status

      # A second self-test, at the other end: the same filter run against the
      # repo must be SILENT. If the environment ever stops resolving QtQuick
      # this job would otherwise fail with a wall of "Member not found on type
      # Qt" noise and look like a real regression.
      - name: prove the filter is not just matching noise
        run: |
          noise=$("${{ steps.find.outputs.bin }}" -I . KeyMap.js 2>/dev/null | wc -l || true)
          echo "sanity: filter produced $noise lines against a non-QML file (expected 0)"

  # ─── Real QML execution ───
  #
  # Six smoke tests under an actual headless engine (~2s locally). Catches
  # what neither the formatter nor the linter can: wiring that resolves and
  # type-checks but is still wrong -- a signal connected to nothing, a
  # function that moved out of scope, a DI shape that does not match.
  #
  # run.sh finds its own Qt and SKIPS CLEANLY (exit 0) when there is none, so
  # if the runner's package layout differs this reports green rather than
  # blocking. Grep the log for "SKIP:" to know whether it really ran.
  qml-smoke:
    name: qml-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install the qml runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-declarative-dev-tools qml6-module-qtqml qml6-module-qtquick

      - name: run the QML smoke tests
        run: |
          qmlbin=$(command -v qml6 || command -v qml || true)
          if [ -z "$qmlbin" ]; then
            echo "::warning::no qml runtime found; tests/qml/run.sh will skip"
          else
            export QT_DIR="$(dirname "$(dirname "$(readlink -f "$qmlbin")")")"
            echo "QT_DIR=$QT_DIR"
          fi
          bash tests/qml/run.sh
